
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HEC Classmates</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;font-family:Arial,sans-serif;
 background:linear-gradient(135deg,#ff9a9e,#a18cd1,#84fab0);
 color:#fff;min-height:100vh;
}
.page{min-height:100vh;padding:25px 15px;text-align:center}
#welcome{display:flex;flex-direction:column;justify-content:center;align-items:center}
h1{font-size:clamp(35px,8vw,55px);text-shadow:2px 3px 8px #654}
.go{
 background:#ffeb3b;color:#29204f;border:0;
 padding:16px 55px;border-radius:40px;
 font-size:23px;font-weight:bold;cursor:pointer;
 box-shadow:0 5px 20px #9b6900;margin-top:25px;
}
#members{display:none}
.group{margin:25px auto;max-width:650px}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.card{
 background:#ffffffdd;color:#30234b;border-radius:18px;
 padding:12px;cursor:pointer;box-shadow:0 5px 15px #604a6b55;
}
.photo{
 height:125px;border-radius:13px;background:linear-gradient(135deg,#fbc2eb,#a6c1ee);
 display:flex;align-items:center;justify-content:center;
 font-size:45px;
}
.card h3{margin:10px 0 3px}
.card p{margin:4px;font-size:13px}
#profile{
 display:none;position:fixed;inset:0;background:#160e2add;
 align-items:center;justify-content:center;padding:20px;
}
.profilebox{background:white;color:#30234b;padding:25px;border-radius:22px;width:100%;max-width:340px}
.close{background:#ffca28;border:0;padding:12px 25px;border-radius:20px;cursor:pointer}
</style>
</head>
<body>
<section id="welcome" class="page">
 <h1>🫶🏻 HEC CLASSMATES</h1>
 <p>OUR CLASS • OUR FRIENDS • OUR MEMORIES</p>
 <button class="go" onclick="showMembers()">GO →</button>
</section>

<section id="members" class="page">
 <h1> OUR CLASS </h1>
 <div class="group">
  <h2>🎀 GIRLS</h2>
  <div class="cards" id="girls"></div>
 </div>
 <div class="group">
  <h2>⚡️ BOYS</h2>
  <div class="cards" id="boys"></div>
 </div>
</section>

<div id="profile">
 <div class="profilebox">
  <div class="photo" id="bigPhoto">📸</div>
  <h2 id="personName"></h2>
  <p id="insta"></p>
  <h2 id="rank"></h2>
  <button class="close" onclick="closeProfile()">CLOSE</button>
 </div>
</div>

<script>
const girls=["Vyshuu","Bhuvana","Meghana","Kavya","Divya"];
const boys=["Prashuu","Ajay","Satish","Vinay Maxy","Pandu"];

function makeCard(name,group){
 const card=document.createElement("div");
 card.className="card";
 card.innerHTML=`<div class="photo">📸</div><h3>${name}</h3><p>Tap to view profile</p>`;
 card.onclick=()=>openProfile(name);
 document.getElementById(group).appendChild(card);
}
girls.forEach(n=>makeCard(n,"girls"));
boys.forEach(n=>makeCard(n,"boys"));

function showMembers(){
 document.getElementById("welcome").style.display="none";
 document.getElementById("members").style.display="block";
}
function openProfile(name){
 document.getElementById("personName").textContent=name;
 document.getElementById("insta").textContent="Instagram: Add ID later";
 document.getElementById("rank").textContent="Rank: Not assigned";
 document.getElementById("profile").style.display="flex";
}
function closeProfile(){
 document.getElementById("profile").style.display="none";
}
</script>
</body>
</html>
