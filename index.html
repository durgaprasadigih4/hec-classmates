
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HEC CLASSMATES</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;text-align:center;color:white;
background:linear-gradient(135deg,#ff8acb,#9b8cff,#65d6b5);min-height:100vh}
h1{margin-top:35px}
.page{padding:25px 15px}
input{padding:14px;border:0;border-radius:12px;font-size:18px;width:220px;text-align:center}
button{padding:13px 25px;border:0;border-radius:12px;background:#ffe45e;
font-weight:bold;font-size:16px;margin:10px;cursor:pointer}
#error{color:#7b001c;font-weight:bold}
#membersPage{display:none}
.section{margin:25px auto;max-width:600px}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.card{background:#ffffff35;padding:20px 8px;border-radius:16px;
font-size:18px;cursor:pointer;border:1px solid #ffffff70}
.card span{display:block;font-size:35px;margin-bottom:8px}
#profile{display:none;position:fixed;inset:0;background:#0009;
align-items:center;justify-content:center;padding:20px}
.profileBox{background:white;color:#333;padding:25px;border-radius:20px;width:100%;max-width:330px}
</style>
</head>
<body>

<div id="lockScreen" class="page">
<h1> HEC CLASSMATES</h1>
<p>OUR CLASS • OUR FRIENDS • OUR MEMORIES</p>
<h2>🔒 Enter Password</h2>
<input id="password" type="password" placeholder="Enter password">
<br>
<button onclick="unlockSite()">UNLOCK</button>
<p id="error"></p>
</div>

<div id="membersPage" class="page">
<h1>🎓 OUR CLASS</h1>
<div class="section">
<h2>🎀 GIRLS</h2>
<div class="cards" id="girls"></div>
</div>
<div class="section">
<h2>⚡️ BOYS</h2>
<div class="cards" id="boys"></div>
</div>
</div>

<div id="profile">
<div class="profileBox">
<h2 id="personName"></h2>
<p id="insta"></p>
<p id="rank"></p>
<button onclick="closeProfile()">CLOSE</button>
</div>
</div>

<script>
const classmates = [
{name:"Vyshuu",group:"girls",insta:"@_vyshnavii_28_",rank:"S"},
{name:"Bhuvana",group:"girls",insta:"@single_girl_potti_05_",rank:"A"},
{name:"Kavya",group:"girls",insta:"@sweet_girl_kavya_128",rank:"A"},
{name:"Divya",group:"girls",insta:"@divya_degala_0109",rank:"B"},
{name:"Prashuu",group:"boys",insta:"@hyy.prashuu",rank:"SS"},
{name:"Ajay",group:"boys",insta:"@black_heart________03",rank:"SS"},
{name:"Satish",group:"boys",insta:"@love_edits_14444",rank:"A"},
{name:"Vinay Maxy",group:"boys",insta:"@vinay_maxx_143",rank:"A"},
{name:"Pandu",group:"boys",insta:"@1x____shadow___",rank:"S"}
];

function unlockSite(){
 const pass=document.getElementById("password").value;
 if(pass==="1432"){
  document.getElementById("lockScreen").style.display="none";
  document.getElementById("membersPage").style.display="block";
 }else{
  document.getElementById("error").textContent="❌ Wrong password! Try again.";
  document.getElementById("password").value="";
 }
}
function makeCards(){
 classmates.forEach(person=>{
  const card=document.createElement("div");
  card.className="card";

  const photos = {
   "Vyshuu":"Screenshot_20261103_132545_Instagram.jpg",
   "Bhuvana":"Screenshot_20261103_134451_Instagram.jpg",
   "Prashuu":"Prashuu.jpg",
   "Ajay":"Ajay.jpg",
   "Kavya":"Kavya.jpg",
   "Pandu":"Pandu.jpg",
   "Satish":"Satish.jpg",
   "Vinay Maxy":"Vinay maxxy.jpg",
   "Divya": empty
  };

  card.innerHTML = photos[person.name]
   ? '<img src="'+photos[person.name]+'" style="width:100%;height:130px;object-fit:cover;border-radius:12px"><br>'+person.name
   : '<span>📸</span>'+person.name;

  card.onclick=()=>openProfile(person);
  document.getElementById(person.group).appendChild(card);
 });
 }


function openProfile(person){
 document.getElementById("personName").textContent=person.name;
 document.getElementById("insta").textContent="Instagram: "+person.insta;
 document.getElementById("rank").textContent="Rank: "+person.rank;
 document.getElementById("profile").style.display="flex";
}
function closeProfile(){
 document.getElementById("profile").style.display="none";
}
makeCards();
</script>
</body>
</html>
